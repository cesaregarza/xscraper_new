[project]
name = "xscraper"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Cesar E Garza", email = "cesar@cegarza.com" }
]
dependencies = [
    "splatnet3-scraper @ git+https://github.com/cesaregarza/SplatNet3_Scraper.git@6602b657c6418cf7c5a8a6e3f051671ba0e2f28a",
    "requests>=2.31.0,<3.0.0",
    "pyarrow>=12.0.1,<13.0.0",
    "pandas>=2.0.3,<3.0.0",
    "sqlalchemy>=2.0.19,<3.0.0",
    "psycopg2-binary>=2.9.7,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sentry-sdk>=1.42.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.7.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "flake8>=6.1.0,<7.0.0",
    "darglint>=1.8.1,<2.0.0",
    "pytest>=7.4.0,<8.0.0",
    "ipykernel>=6.25.1,<7.0.0",
    "tqdm>=4.66.1,<5.0.0",
    "sshtunnel>=0.4.0,<0.5.0",
]

[project.scripts]
xscraper = "xscraper.job.main:job"
xscraper_with_logs = "xscraper.job.main:job_with_logging"
setup_db = "xscraper.job.main:setup_db"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/xscraper"]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 80

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
exclude = [".venv", "tests", "docs", "examples"]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
    "-v",
    "--tb=auto",
    "--showlocals",
    "--color=yes",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "internet: marks tests as requiring internet access (deselect with '-m \"not internet\"')",
]
